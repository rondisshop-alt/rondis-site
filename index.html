<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رُندیس | ویترین سیم‌کارت</title><style>*{box-sizing:border-box}body{margin:0;background:#071526;color:#f7f3e9;font-family:Tahoma,Arial,sans-serif}header{padding:32px 18px;text-align:center;background:#0d2138;border-bottom:1px solid #b79a59}h1{font-size:38px;color:#d9bb79;margin:0}header p{line-height:2}.wrap{max-width:950px;margin:auto;padding:22px 14px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select{background:#122b46;color:white;border:1px solid #65748a;border-radius:9px;padding:13px;font-size:15px;flex:1;min-width:130px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.item{background:#10263f;border:1px solid #34465a;border-radius:15px;padding:19px}.number{font-size:25px;font-weight:bold;direction:ltr;text-align:center;color:#e7c983}.meta{display:flex;justify-content:space-between;margin:15px 0;color:#d5d9e0}.price{font-size:19px;color:#fff}.actions{display:flex;gap:8px}.actions a{flex:1;text-align:center;text-decoration:none;background:#b99a58;color:#091626;border-radius:8px;padding:11px;font-weight:bold}.actions a:last-child{background:#203c59;color:white}.sold{opacity:.55}.empty{text-align:center;padding:35px;color:#b9c4d0}footer{text-align:center;padding:25px;color:#aab7c7;font-size:12px}</style></head><body><header><h1>رُندیس</h1><div>RONDIS</div><p>ویترین آنلاین خرید و فروش سیم‌کارت<br>انتقال مالکیت قانونی با هماهنگی فروشنده</p></header><main class="wrap"><div class="tools"><input id="search" placeholder="جست‌وجوی شماره..." inputmode="numeric"><select id="type"><option value="">همه سیم‌کارت‌ها</option><option>دائمی</option><option>اعتباری</option></select><select id="status"><option value="">همه وضعیت‌ها</option><option value="موجود">موجود</option><option value="فروخته‌شده">فروخته‌شده</option></select></div><div id="items" class="grid"></div></main><footer>رُندیس | فروش صرفاً آنلاین — جهت استعلام و خرید تماس بگیرید</footer><script src="inventory.js"></script><script>const contact='09172132928';const items=document.getElementById('items');function render(){let q=document.getElementById('search').value.trim(),t=document.getElementById('type').value,s=document.getElementById('status').value;let data=(window.RONDIS_INVENTORY||[]).filter(x=>(!q||x.number.includes(q))&&(!t||x.type===t)&&(!s||x.status===s));items.replaceChildren();if(!data.length){let e=document.createElement('div');e.className='empty';e.textContent='فعلاً شماره‌ای برای نمایش وجود ندارد.';items.append(e)}data.forEach(x=>{let card=document.createElement('article');card.className='item'+(x.status==='فروخته‌شده'?' sold':'');let num=document.createElement('div');num.className='number';num.textContent=x.number;card.append(num);let meta=document.createElement('div');meta.className='meta';let a=document.createElement('span');a.textContent=x.type;let b=document.createElement('span');b.textContent=x.status;meta.append(a,b);card.append(meta);let price=document.createElement('p');price.className='price';price.textContent=x.price?x.price+' تومان':'قیمت: تماس بگیرید';card.append(price);if(x.status!=='فروخته‌شده'){let acts=document.createElement('div');acts.className='actions';let call=document.createElement('a');call.href='tel:'+contact;call.textContent='تماس';let wa=document.createElement('a');wa.href='https://wa.me/98'+contact.slice(1)+'?text='+encodeURIComponent('سلام، برای استعلام سیم‌کارت '+x.number+' پیام می‌دهم.');wa.textContent='واتساپ';acts.append(call,wa);card.append(acts)}items.append(card)})}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',render));render();</script></body></html>
